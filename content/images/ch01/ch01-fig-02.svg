<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="ar102" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f766e">三种交换方式对比</text>
  <line x1="40" y1="52" x2="920" y2="52" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="40" y="105" width="96" height="50" rx="8" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="88" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f766e">电路交换</text>
  <rect x="170" y="108" width="130" height="44" rx="8" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="235" y="135" text-anchor="middle" font-size="15" fill="#1f2328">① 建立连接</text>
  <line x1="302" y1="130" x2="352" y2="130" stroke="#0f766e" stroke-width="2" marker-end="url(#ar102)"/>
  <rect x="356" y="108" width="240" height="44" rx="8" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="476" y="135" text-anchor="middle" font-size="14" fill="#1f2328">② 通话（占用专用物理通路）</text>
  <line x1="598" y1="130" x2="636" y2="130" stroke="#0f766e" stroke-width="2" marker-end="url(#ar102)"/>
  <rect x="640" y="108" width="130" height="44" rx="8" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="705" y="135" text-anchor="middle" font-size="15" fill="#1f2328">③ 释放连接</text>
  <text x="170" y="178" font-size="13" fill="#64748b">必先建立端到端专用物理通路，通信中独占资源；适合实时、大批量连续传送（如传统电话）。</text>

  <line x1="40" y1="205" x2="920" y2="205" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="40" y="225" width="96" height="50" rx="8" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="88" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f766e">报文交换</text>
  <circle cx="185" cy="250" r="6" fill="#0f766e"/>
  <text x="185" y="278" text-anchor="middle" font-size="13" fill="#64748b">源点</text>
  <rect x="200" y="190" width="180" height="24" rx="4" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
  <text x="290" y="207" text-anchor="middle" font-size="13" fill="#1f2328">整个报文（不切分）</text>
  <rect x="280" y="225" width="120" height="50" rx="8" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="340" y="246" text-anchor="middle" font-size="15" fill="#1f2328">交换节点</text>
  <text x="340" y="266" text-anchor="middle" font-size="13" fill="#64748b">存储 + 转发</text>
  <rect x="480" y="225" width="120" height="50" rx="8" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="540" y="246" text-anchor="middle" font-size="15" fill="#1f2328">交换节点</text>
  <text x="540" y="266" text-anchor="middle" font-size="13" fill="#64748b">存储 + 转发</text>
  <circle cx="695" cy="250" r="6" fill="#0f766e"/>
  <text x="695" y="278" text-anchor="middle" font-size="13" fill="#64748b">终点</text>
  <line x1="192" y1="250" x2="276" y2="250" stroke="#0f766e" stroke-width="2" marker-end="url(#ar102)"/>
  <line x1="402" y1="250" x2="476" y2="250" stroke="#0f766e" stroke-width="2" marker-end="url(#ar102)"/>
  <line x1="602" y1="250" x2="687" y2="250" stroke="#0f766e" stroke-width="2" marker-end="url(#ar102)"/>
  <text x="170" y="300" font-size="13" fill="#64748b">将整个报文先完整存储、再查表转发；报文大 → 时延大、对节点缓存要求高（电报时代产物）。</text>

  <line x1="40" y1="322" x2="920" y2="322" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="40" y="405" width="96" height="50" rx="8" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="88" y="435" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f766e">分组交换</text>
  <rect x="150" y="340" width="200" height="26" rx="4" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="216.7" y1="340" x2="216.7" y2="366" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="283.4" y1="340" x2="283.4" y2="366" stroke="#0f766e" stroke-width="1.5"/>
  <text x="183" y="358" text-anchor="middle" font-size="13" fill="#1f2328">P1</text>
  <text x="250" y="358" text-anchor="middle" font-size="13" fill="#1f2328">P2</text>
  <text x="317" y="358" text-anchor="middle" font-size="13" fill="#1f2328">P3</text>
  <text x="250" y="332" text-anchor="middle" font-size="13" fill="#64748b">报文切分成带首部的分组</text>
  <circle cx="185" cy="478" r="6" fill="#0f766e"/>
  <text x="185" y="500" text-anchor="middle" font-size="13" fill="#64748b">源点</text>
  <rect x="280" y="453" width="120" height="50" rx="8" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="340" y="474" text-anchor="middle" font-size="15" fill="#1f2328">交换节点</text>
  <text x="340" y="494" text-anchor="middle" font-size="13" fill="#64748b">独立存储转发</text>
  <rect x="480" y="453" width="120" height="50" rx="8" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="540" y="474" text-anchor="middle" font-size="15" fill="#1f2328">交换节点</text>
  <text x="540" y="494" text-anchor="middle" font-size="13" fill="#64748b">独立存储转发</text>
  <circle cx="695" cy="478" r="6" fill="#0f766e"/>
  <text x="695" y="500" text-anchor="middle" font-size="13" fill="#64748b">终点</text>
  <line x1="192" y1="478" x2="276" y2="478" stroke="#0f766e" stroke-width="2" marker-end="url(#ar102)"/>
  <line x1="402" y1="478" x2="476" y2="478" stroke="#0f766e" stroke-width="2" marker-end="url(#ar102)"/>
  <line x1="602" y1="478" x2="687" y2="478" stroke="#0f766e" stroke-width="2" marker-end="url(#ar102)"/>
  <rect x="420" y="456" width="34" height="20" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="437" y="470" text-anchor="middle" font-size="12" fill="#1f2328">P1</text>
  <rect x="624" y="456" width="34" height="20" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="641" y="470" text-anchor="middle" font-size="12" fill="#1f2328">P3</text>
  <text x="170" y="392" font-size="13" fill="#64748b">各分组可沿不同路径独立传送，不必等整个报文到齐。</text>
  <text x="170" y="522" font-size="14" fill="#dc2626" font-weight="bold">优点：无需建立连接、灵活、高效；分组小 → 时延小、缓存省（互联网采用）。</text>
</svg>
